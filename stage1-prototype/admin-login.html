<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Grievance360</title>
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <i class="bi bi-shield-check text-warning me-2 fs-2"></i>
        <div>
          <span class="d-block fw-bold text-white lh-1">Grievance360</span>
          <small class="text-warning fw-semibold fs-7" style="font-size: 0.75rem;">Vel Tech University</small>
        </div>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto gap-2 mt-2 mt-lg-0">
          <li class="nav-item">
            <a class="nav-link text-white-50" href="index.html"><i class="bi bi-house-door me-1"></i> Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-white-50" href="submit.html"><i class="bi bi-file-earmark-plus me-1"></i> Submit Complaint</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-white-50" href="track.html"><i class="bi bi-search me-1"></i> Track Complaint</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active text-white" href="admin-login.html"><i class="bi bi-person-lock me-1"></i> Admin Login</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Login Container -->
  <div class="container my-auto py-5">
    <div class="row justify-content-center">
      <div class="col-md-5 col-lg-4">
        <div class="glass-card p-4">
          <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-circle p-3 mb-3 shadow" style="width: 60px; height: 60px;">
              <i class="bi bi-lock-fill fs-3"></i>
            </div>
            <h4>Portal Administrator</h4>
            <p class="text-muted small">Sign in to manage student grievances</p>
          </div>

          <form id="loginForm" class="needs-validation" novalidate>
            <div class="mb-3">
              <label for="username" class="form-label fw-semibold">Username</label>
              <div class="input-group">
                <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control border-start-0 ps-0" id="username" placeholder="e.g. admin" required>
                <div class="invalid-feedback">Username is required.</div>
              </div>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label fw-semibold">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-key"></i></span>
                <input type="password" class="form-control border-start-0 ps-0" id="password" placeholder="••••••••" required>
                <div class="invalid-feedback">Password is required.</div>
              </div>
            </div>

            <!-- Login Fail Alert -->
            <div id="loginAlert" class="alert alert-danger d-none mt-2 mb-3 py-2 text-center" role="alert">
              <small><i class="bi bi-x-circle-fill me-1"></i> Invalid username or password.</small>
            </div>

            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-primary"><i class="bi bi-box-arrow-in-right me-2"></i>Login</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="py-3 text-center text-secondary">
    <div class="container">
      <small>Designed & Developed by Varshith G S</small>
    </div>
  </footer>

  <!-- Bootstrap 5 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Custom Script -->
  <script src="script.js"></script>
</body>
</html>
